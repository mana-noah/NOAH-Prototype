<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSN Prototype v0.2</title><style>
body{margin:0;background:#f4f5f7;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid #dfe3e8;padding:18px 16px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:20px}header p,.note{color:#69717d;font-size:13px;line-height:1.5}main{max-width:760px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{border:1px solid #dfe3e8;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.tabs button.active{background:#3b5ccc;color:#fff}.card{background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:16px;margin-bottom:12px}.post{border-top:1px solid #dfe3e8;padding:14px 0}.post:first-child{border-top:0}.meta{font-size:12px;color:#69717d}.post h3{font-size:16px;margin:5px 0}.post p{line-height:1.55}.tag{display:inline-block;background:#f0f2f5;border-radius:7px;padding:3px 7px;font-size:11px;margin-right:4px}.stat{display:grid;grid-template-columns:1fr auto;gap:7px;margin:9px 0}.bar{height:9px;background:#edf0f3;border-radius:9px;overflow:hidden;grid-column:1/3}.fill{height:100%;background:#3b5ccc;border-radius:9px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}input[type=range],select{width:100%}select{padding:10px;border:1px solid #dfe3e8;border-radius:9px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:0;border-radius:10px;padding:10px 14px;background:#3b5ccc;color:#fff}.actions button.secondary{background:#eef0f3;color:#20242a}.changed{background:#f5f7ff;border:1px solid #dbe1ff;border-radius:10px;padding:10px;margin-top:12px}.hidden{display:none}.empty{padding:25px;color:#69717d;text-align:center}
</style></head><body><header><h1>RSN — 共鳴SNS プロトタイプ v0.2</h1><p>観察する → 選ぶ → 変化を見る。</p></header><main>
<div class="tabs"><button class="active" data-tab="feed">フィード</button><button data-tab="environment">情報環境</button><button data-tab="settings">環境を変える</button></div>
<section id="feed" class="tab"><div class="card"><div class="actions" style="margin-top:0"><button id="recommended" class="secondary">おすすめ</button><button id="chrono" class="secondary">時系列</button></div><div id="feedList"></div></div></section>
<section id="environment" class="tab hidden"><div class="card"><h2>現在の情報環境</h2><p class="note">性格や真実の診断ではなく、現在の接触状況です。</p><div id="topicStats"></div></div><div class="card"><h2>情報の形式</h2><div id="formatStats"></div></div><div class="card"><h2>変化の経路</h2><p>科学・技術を優先 → おすすめ接触が増加 → 関連投稿の閲覧が増加 → さらに関連投稿が推薦される、という循環を経路として表示します。</p></div></section>
<section id="settings" class="tab hidden"><div class="card"><h2>情報環境を変える</h2><label>科学・技術への接触量 <span id="scienceValue"></span></label><input id="science" type="range" min="5" max="50" value="31"><label>科学・技術で増やしたい形式</label><select id="format"><option value="technical">技術解説</option><option value="expert">専門家分析</option><option value="primary">一次資料</option><option value="practice">実務・制作</option></select><p class="note">確定前に変更結果を確認できます。</p><div id="preview" class="changed"></div><div class="actions"><button id="apply">この変更を適用</button><button id="reset" class="secondary">元に戻す</button></div></div><div class="card"><h2>今回の変更</h2><div id="comparison" class="empty">まだ変更はありません。</div></div></section>
</main><script>
var posts=[{topic:'科学・技術',format:'technical',title:'量子計算の基本を図解で理解する',body:'専門用語を少なめに、量子ビットと古典ビットの違いを説明。',t:1},{topic:'創作',format:'practice',title:'世界観を設定しすぎないための設計メモ',body:'未設定の余白を残すことも、設計上の選択になる。',t:2},{topic:'ゲーム',format:'user',title:'最近遊んだゲームで感じたこと',body:'探索しているだけで世界から反応が返ってくる感覚について。',t:3},{topic:'科学・技術',format:'expert',title:'生成AIの現在地を研究者が解説',body:'研究動向と実用化の距離を、専門家の視点から整理。',t:4},{topic:'日常',format:'user',title:'今日は静かな場所で過ごした',body:'何もしない時間も悪くない、という短い日記。',t:5},{topic:'科学・技術',format:'primary',title:'研究機関が公開した一次資料',body:'原資料への導線と、確認できる範囲だけを提示。',t:6},{topic:'社会',format:'expert',title:'SNSと情報環境についての考察',body:'推薦システムと利用者の選択について考える。',t:7},{topic:'科学・技術',format:'practice',title:'AIを制作現場で使うときの実例',body:'制作工程でどこまで自動化できるかを具体例で紹介。',t:8}];
var state={science:31,format:'technical',mode:'recommended'};
var baseTopics={'科学・技術':31,'創作':24,'ゲーム':22,'日常':13,'社会':8,'その他':2};
var baseFormats={'技術解説':43,'実務・制作':19,'専門家分析':18,'一次資料':12,'利用者体験':8};
function labelFormat(f){return ({technical:'技術解説',practice:'実務・制作',expert:'専門家分析',primary:'一次資料',user:'利用者体験'})[f]||f}
function renderFeed(){var list=posts.slice();if(state.mode==='recommended'){list.sort(function(a,b){return (a.topic==='科学・技術'?-2:0)+(a.format===state.format?-1:0)+a.t-((b.topic==='科学・技術'?-2:0)+(b.format===state.format?-1:0)+b.t)})}else{list.sort(function(a,b){return a.t-b.t})}var s='';list.forEach(function(p){s+='<article class="post"><div class="meta">'+p.topic+' · '+labelFormat(p.format)+'</div><h3>'+p.title+'</h3><p>'+p.body+'</p><span class="tag">'+p.topic+'</span><span class="tag">'+labelFormat(p.format)+'</span></article>'});document.getElementById('feedList').innerHTML=s}
function renderEnvironment(){var topics=Object.assign({},baseTopics);topics['科学・技術']=state.science;var rest=100-state.science;var factor=rest/69;['創作','ゲーム','日常','社会','その他'].forEach(function(k){topics[k]=Math.round(baseTopics[k]*factor)});var total=Object.keys(topics).reduce(function(a,k){return a+topics[k]},0);topics['その他']+=100-total;var s='';Object.keys(topics).forEach(function(k){s+='<div class="stat"><span>'+k+'</span><b>'+topics[k]+'%</b><div class="bar"><div class="fill" style="width:'+topics[k]+'%"></div></div></div>'});document.getElementById('topicStats').innerHTML=s;var fm=Object.assign({},baseFormats);if(state.format==='expert'){fm['専門家分析']=25;fm['技術解説']=36;fm['実務・制作']=17;fm['一次資料']=12;fm['利用者体験']=10}var f='';Object.keys(fm).forEach(function(k){f+='<div class="stat"><span>'+k+'</span><b>'+fm[k]+'%</b><div class="bar"><div class="fill" style="width:'+fm[k]+'%"></div></div></div>'});document.getElementById('formatStats').innerHTML=f}
function renderPreview(){var v=Number(document.getElementById('science').value),f=document.getElementById('format').value;document.getElementById('scienceValue').textContent=v+'%';document.getElementById('preview').innerHTML='科学・技術 <b>'+state.science+'% → '+v+'%</b><br>重点形式: <b>'+labelFormat(f)+'</b>'}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.querySelectorAll('.tab').forEach(function(x){x.classList.add('hidden')});document.getElementById(b.dataset.tab).classList.remove('hidden')}});
document.getElementById('recommended').onclick=function(){state.mode='recommended';renderFeed()};document.getElementById('chrono').onclick=function(){state.mode='chrono';renderFeed()};document.getElementById('science').oninput=renderPreview;document.getElementById('format').onchange=renderPreview;
document.getElementById('apply').onclick=function(){var old={science:state.science,format:state.format};state.science=Number(document.getElementById('science').value);state.format=document.getElementById('format').value;document.getElementById('comparison').classList.remove('empty');document.getElementById('comparison').innerHTML='科学・技術: <b>'+old.science+'% → '+state.science+'%</b><br>重点形式: '+labelFormat(old.format)+' → <b>'+labelFormat(state.format)+'</b><p class="note">変更後の環境をもう一度観察できます。「変更しない」ことも選択肢です。</p>';renderEnvironment();renderFeed();renderPreview()};
document.getElementById('reset').onclick=function(){document.getElementById('science').value=state.science;document.getElementById('format').value=state.format;renderPreview()};
renderFeed();renderEnvironment();renderPreview();
</script></body></html>
